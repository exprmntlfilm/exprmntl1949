backend:
  name: git-gateway
  repo: exprmntlfilm/exprmntl1949
  branch: main
  identity_url: https://auth.decapbridge.com/sites/2b427b3e-f680-4870-8274-eb0ce795d53a
  gateway_url: https://gateway.decapbridge.com
  use_graphql: true

media_folder: "src/images/uploads"
public_folder: "images/uploads"

locale: "en"

collections:
  - name: "films"
    label: "Films"
    label_singular: "Film"
    folder: "src/films"
    create: true
    slug: "{{slug}}"
    summary: "{{title}} ({{year}}) — Edition {{edition}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Identifier (slug)", name: "slug", widget: "string", hint: "Used in the URL. Don't change this after the entry is created, or the film's link changes."}
      - {label: "Year", name: "year", widget: "string", required: false, hint: "e.g. 1958, or 'n. d.' if unknown"}
      - label: "Festival edition"
        name: "edition"
        widget: "select"
        options:
          - {label: "1949", value: "1949"}
          - {label: "1958", value: "1958"}
          - {label: "1963", value: "1963"}
          - {label: "1967", value: "1967"}
          - {label: "1974", value: "1974"}
      - {label: "Catalogue number", name: "cat_num", widget: "string", required: false}
      - {label: "Edition tag text (optional)", name: "edition_label", widget: "string", required: false, hint: "Leave blank for the automatic default ('Edition 1949'). Fill in to write your own text."}
      - label: "Director(s)"
        name: "directors"
        widget: "list"
        field: {label: "Director's name", name: "name", widget: "string"}
        hint: "Type the name exactly as it appears on the director's page (e.g. Norman McLaren). If it matches an existing director, the link is created automatically. If the film has more than one director, add one line per person — never create the film's page twice."
      - {label: "Still (cover image)", name: "still", widget: "image", required: false, hint: "Appears on the film's page, in the catalogue, and on directors' pages."}
      - label: "Additional photos (gallery)"
        name: "gallery"
        widget: "list"
        field: {label: "Photo", name: "image", widget: "image"}
        required: false
        hint: "With 1+ photos here (besides the still), the 'Film stills' resource turns into a gallery button on its own."
      - label: "Awards"
        name: "awards"
        widget: "list"
        field: {label: "Award", name: "award", widget: "string"}
        required: false
        hint: "One award per line, e.g. 'Grand Prize, EXPRMNTL 3 (1963)'. Leave empty if the film received no award."
      - label: "Resources (documents)"
        name: "resources"
        widget: "list"
        required: false
        fields:
          - {label: "Document name", name: "name", widget: "string"}
          - {label: "File (upload)", name: "file", widget: "file", required: false}
          - {label: "External link (optional, used if no file is uploaded)", name: "url", widget: "string", required: false}
      - {label: "Synopsis", name: "body", widget: "markdown", required: false}

  - name: "people"
    label: "Directors"
    label_singular: "Director"
    folder: "src/people"
    create: true
    slug: "{{slug}}"
    summary: "{{name}} — {{country}}"
    fields:
      - {label: "Name", name: "name", widget: "string"}
      - {label: "Identifier (slug)", name: "slug", widget: "string", hint: "Used in the URL. Don't change this after the entry is created."}
      - {label: "Country", name: "country", widget: "string", required: false}
      - label: "Editions attended"
        name: "editions"
        widget: "select"
        multiple: true
        options:
          - {label: "1949", value: "1949"}
          - {label: "1958", value: "1958"}
          - {label: "1963", value: "1963"}
          - {label: "1967", value: "1967"}
          - {label: "1974", value: "1974"}
      - {label: "Role (optional)", name: "role", widget: "string", required: false, hint: "Leave blank for 'Filmmaker'. Use for cases like 'Founder & director'."}
      - {label: "Featured heading (optional)", name: "role_heading", widget: "string", required: false, hint: "Replaces the automatic heading ('Filmmaker at EXPRMNTL...') with your own text."}
      - {label: "Editions tag text (optional)", name: "editions_label", widget: "string", required: false, hint: "e.g. 'All five editions'. Leave blank for the automatic default."}
      - {label: "Portrait (cover image)", name: "photo", widget: "image", required: false}
      - label: "Additional photos (gallery)"
        name: "gallery"
        widget: "list"
        field: {label: "Photo", name: "image", widget: "image"}
        required: false
        hint: "With 1+ photos here (besides the portrait), the 'Portrait photographs' resource turns into a gallery button on its own."
      - label: "Awards"
        name: "awards"
        widget: "list"
        field: {label: "Award", name: "award", widget: "string"}
        required: false
        hint: "One award per line, e.g. 'Jury Special Mention, EXPRMNTL 4 (1967)'. Leave empty if this person received no award."
      - label: "Films by this director"
        name: "films"
        widget: "list"
        field: {label: "Film title", name: "title", widget: "string"}
        required: false
        hint: "Type the title exactly as it appears on the film's page. If it matches an existing film, its card appears automatically below."
      - label: "Resources (documents)"
        name: "resources"
        widget: "list"
        required: false
        fields:
          - {label: "Document name", name: "name", widget: "string"}
          - {label: "File (upload)", name: "file", widget: "file", required: false}
          - {label: "External link (optional, used if no file is uploaded)", name: "url", widget: "string", required: false}
      - {label: "Biography", name: "body", widget: "markdown", required: false}

  - name: "stories"
    label: "Stories"
    label_singular: "Story"
    folder: "src/stories"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Identifier (slug)", name: "slug", widget: "string", hint: "Used in the URL. Don't change this after the entry is created."}
      - {label: "Illustration / photo (optional)", name: "image", widget: "image", required: false}
      - {label: "Short excerpt (shown on the card)", name: "excerpt", widget: "text", hint: "One or two sentences — this is what shows on the Stories index page."}
      - {label: "Source / attribution (optional)", name: "source", widget: "string", required: false, hint: "e.g. a name, a publication, or 'Festival archive'."}
      - label: "Related edition (optional)"
        name: "edition"
        widget: "select"
        required: false
        options:
          - {label: "1949", value: "1949"}
          - {label: "1958", value: "1958"}
          - {label: "1963", value: "1963"}
          - {label: "1967", value: "1967"}
          - {label: "1974", value: "1974"}
      - {label: "Full story", name: "body", widget: "markdown", hint: "The full text, shown on the story's own page."}

  - name: "editions"
    label: "Editions"
    label_singular: "Edition"
    folder: "src/editions"
    create: false
    slug: "{{year}}"
    summary: "{{label}} ({{year}})"
    fields:
      - {label: "Year", name: "year", widget: "number", value_type: "int"}
      - {label: "Label", name: "label", widget: "string", hint: "e.g. EXPRMNTL 1"}
      - {label: "Introductory text", name: "blurb", widget: "text"}
      - {label: "Poster (cover image)", name: "poster", widget: "image", required: false}
      - label: "Alternate posters (gallery)"
        name: "poster_gallery"
        widget: "list"
        field: {label: "Poster", name: "image", widget: "image"}
        required: false
      - label: "General edition photos (gallery)"
        name: "gallery"
        widget: "list"
        field: {label: "Photo", name: "image", widget: "image"}
        required: false
      - label: "Resources (documents)"
        name: "resources"
        widget: "list"
        fields:
          - {label: "Document name", name: "name", widget: "string"}
          - {label: "File (upload)", name: "file", widget: "file", required: false}
          - {label: "External link (optional, used if no file is uploaded)", name: "url", widget: "string", required: false}
